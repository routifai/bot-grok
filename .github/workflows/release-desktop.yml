name: release-desktop

# Builds signed desktop installers and uploads them as workflow artifacts. This repo is
# private and has no public release feed, so electron-builder's `publish` target is
# disabled (apps/desktop/package.json, `"publish": null`) and this workflow never
# publishes a GitHub Release or update feed — download the artifact from the run instead.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Builds for the same tag must not overlap; different tags may build in parallel.
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      platforms: ${{ steps.platforms.outputs.include }}
      windows: ${{ steps.platforms.outputs.windows }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, version, and ancestry
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF_TYPE" != "tag" ]]; then
            echo "Desktop builds must run from a tag, including manual dispatches." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Desktop releases use the stable vMAJOR.MINOR.PATCH channel." >&2
            exit 1
          fi

          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match desktop version $version." >&2
            exit 1
          fi

          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "The workflow revision does not match the tagged commit." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "Desktop releases must point to a commit already on main." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
      - name: Choose build platforms
        id: platforms
        env:
          # Windows builds only when an Authenticode certificate is configured; macOS and Linux always build.
          WINDOWS_SIGNING: ${{ secrets.DESKTOP_WIN_CSC_LINK != '' }}
        shell: bash
        run: |
          set -euo pipefail
          include='[{"os":"macos-26","artifact":"macos"},{"os":"ubuntu-24.04","artifact":"linux"}]'
          if [[ "$WINDOWS_SIGNING" == "true" ]]; then
            include="$(jq -c '. + [{"os":"windows-2022","artifact":"windows"}]' <<<"$include")"
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "windows=$WINDOWS_SIGNING" >> "$GITHUB_OUTPUT"

  build:
    name: Build signed ${{ matrix.artifact }} artifacts
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.platforms) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Build renderer and Electron main process
        run: pnpm --filter @nova/web build && pnpm --filter @nova/desktop build
        env:
          NOVA_ALLOW_DEV_SECRETS: "1"

      - name: Require macOS signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.DESKTOP_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY_P8"
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          chmod 600 "$APPLE_API_KEY"
      - name: Package signed and notarized universal macOS app
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.DESKTOP_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
        run: >-
          pnpm --filter @nova/desktop exec electron-builder
          --mac --universal --publish never -c.forceCodeSigning=true
      - name: Remove the App Store Connect API key from the runner
        if: always() && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
        run: rm -f "$APPLE_API_KEY"
      - name: Verify macOS signature and notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="apps/desktop/out/mac-universal/Nova.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Require Windows signing credentials
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.DESKTOP_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$WIN_CSC_LINK"
          test -n "$WIN_CSC_KEY_PASSWORD"
      - name: Package signed x64 Windows app
        if: runner.os == 'Windows'
        env:
          WIN_CSC_LINK: ${{ secrets.DESKTOP_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WIN_CSC_KEY_PASSWORD }}
        run: >-
          pnpm --filter @nova/desktop exec electron-builder
          --win --x64 --publish never -c.forceCodeSigning=true
      - name: Verify Windows Authenticode signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $executables = @(
            Get-ChildItem "apps/desktop/out/*.exe"
            Get-ChildItem "apps/desktop/out/win-unpacked/*.exe"
          )
          if ($executables.Count -lt 2) { throw "Windows installer or application was not created." }
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature $executable.FullName
            if ($signature.Status -ne "Valid") {
              throw "$($executable.Name) signature is $($signature.Status)."
            }
          }

      - name: Package x64 Linux AppImage
        if: runner.os == 'Linux'
        run: >-
          pnpm --filter @nova/desktop exec electron-builder
          --linux --x64 --publish never

      - name: Upload signed installers as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.artifact }}-${{ needs.validate.outputs.sha }}
          path: |
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.blockmap
            apps/desktop/out/*.dmg
            apps/desktop/out/*.exe
            apps/desktop/out/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package:
    name: Attest and collect build artifacts
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*-${{ needs.validate.outputs.sha }}
          path: release-artifacts
          merge-multiple: true
      - name: Verify every platform built and checksum the artifacts
        env:
          WINDOWS_BUILT: ${{ needs.validate.outputs.windows }}
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'release-artifacts/*.dmg' >/dev/null
          compgen -G 'release-artifacts/*.zip' >/dev/null
          compgen -G 'release-artifacts/*.AppImage' >/dev/null
          if [[ "$WINDOWS_BUILT" == "true" ]]; then
            compgen -G 'release-artifacts/*.exe' >/dev/null
          fi
          (
            cd release-artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-artifacts/*
      - name: Upload the combined build as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release-${{ needs.validate.outputs.version }}
          path: release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
