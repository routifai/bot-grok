<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Nova's orb: a dark sphere drawn in flowing contour lines, blue to violet to pink. -->
  <defs>
    <radialGradient id="core" cx="42%" cy="38%" r="62%">
      <stop offset="0" stop-color="#1b1d3d"/>
      <stop offset="1" stop-color="#07070f"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb4ff"/>
      <stop offset=".55" stop-color="#8b7dff"/>
      <stop offset="1" stop-color="#ff7ab6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset=".72" stop-color="#8b93ff" stop-opacity="0"/>
      <stop offset=".9" stop-color="#8b93ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b93ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><circle cx="32" cy="32" r="25"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="url(#core)"/>
  <g clip-path="url(#c)" fill="none" stroke="url(#line)" stroke-linecap="round">
    <path d="M6 22c10-6 20 6 30 0s18-8 24-2" stroke-width="2.4"/>
    <path d="M6 30c9-5 19 5 28 0s18-7 26-1" stroke-width="2.2" opacity=".9"/>
    <path d="M6 38c10-4 19 6 29 1s17-6 25 0" stroke-width="2.4"/>
    <path d="M8 46c9-3 18 5 27 1s15-5 21 0" stroke-width="2" opacity=".8"/>
  </g>
  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#line)" stroke-width="2.6"/>
</svg>
