appId: com.superchat.app
name: Superchat mobile smoke
---
- launchApp:
    clearState: true

- assertVisible: "Sign in to Superchat"
- assertVisible: "Sign up"
- tapOn: "Sign up"
- assertVisible: "Sign up for Superchat"
- assertVisible: "Name"
- tapOn: "Sign in"
- assertVisible: "Sign in to Superchat"
- tapOn: "Email"
- inputText: ${SUPERCHAT_E2E_EMAIL}
- tapOn: "Password"
- inputText: ${SUPERCHAT_E2E_PASSWORD}
- tapOn: "Sign in to Superchat"
- tapOn: "Sign in"

- extendedWaitUntil:
    visible: "New bot"
    timeout: 30000
- tapOn: "New bot"
- assertVisible: "Name this bot"
- tapOn: "Name this bot"
- inputText: ${SUPERCHAT_E2E_BOT_NAME}
- hideKeyboard
- tapOn: "Create"

- extendedWaitUntil:
    visible: "Message…"
    timeout: 30000
- tapOn: "Message…"
- inputText: ${SUPERCHAT_E2E_MESSAGE}
- pressKey: Enter
- assertVisible: ${SUPERCHAT_E2E_MESSAGE}

