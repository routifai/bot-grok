spec_version: 1
name: nova-claude
description: >-
  Nova's Super Chat: the person's one long-running assistant, which researches, analyzes and
  drafts by delegating to Sub-agents, and keeps the conversation itself bounded with
  Omnigent's own Rollover and Memory.

executor:
  type: omnigent
  config:
    harness: claude-sdk
    model: ${NOVA_CLAUDE_MODEL}

interaction:
  conversational: true
  modalities:
    input: [text, file]
    output: [text]

tools:
  builtins:
    - web_search
    - web_fetch
  # The three Sub-agent Types this Super Chat may launch — see agents/<dir>/. Each has its own
  # executor and max_sessions; a turn launches one by its declared `name`, never by naming a
  # model (CONTEXT.md "Sub-agent Type").
  agents:
    - researcher
    - analyst
    - drafter
