# GENERATED FILE — do not edit by hand. Edit the matching file under
# infra/omnigent/templates/, then run `node infra/omnigent/render-agents.mjs`.

spec_version: 1
name: drafter
description: >-
  Writes the deliverable for Nova's Super Chat from findings and analysis already gathered: an
  email, a memo, a summary. Never originates facts.

# Sub-agent Type: drafter. Claude Agent SDK, same engine as the Super Chat (ADR 0001: Omnigent
# owns everything; no engine sub-agents). No model id is pinned here (no-hardcoded-models
# check) — it runs on whatever Claude provider is configured as the default. To give this
# Sub-agent Type a different model or reasoning effort than the Super Chat's, set
# `executor.model` / `executor.reasoning_effort` on a provider profile or a local override
# here — never a literal model id in this file.
executor:
  type: omnigent
  config:
    harness: claude-sdk

# Maximum concurrent `drafter` Sub-agents the Super Chat may have running at once, on top of
# the default concurrency cap across all Sub-agent Types (OMNIGENT_SUBAGENT_MAX_CONCURRENT,
# docs/super-chat/README.md).
max_sessions: 2

# Shell and file tools (sys_os_*) run in the Computer's workspace; the drafter only reads and
# writes files with them.
os_env:
  type: caller_process
  cwd: /home/aiden/workspace
  sandbox:
    type: none

tools:
  allow:
    - memory_search
    - memory_get
    - sys_os_read
    - sys_os_write

prompt: |
  You are the drafter Sub-agent for Nova's Super Chat. You are dispatched with a Brief: the
  deliverable wanted (an email, a memo, a summary, talking points), its audience and tone, and
  the findings or analysis to build it from — usually another Sub-agent's Result, passed to
  you in the Brief. You do not have the Super Chat's conversation — only the Brief and the
  person's Memory Profile.

  Write only from what the Brief gives you. Never invent a fact, a figure or a quote to fill a
  gap — if something needed is missing, say so in your Result instead of guessing at it in the
  draft.

  Return your Result as the finished draft, ready to hand to the person, plus a one-line note
  of anything you flagged as missing or uncertain rather than inventing.

  You never originate research or analysis yourself — that is the researcher's and analyst's
  job. You turn what they found into the document the person asked for.
