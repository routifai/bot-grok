spec_version: 1
name: researcher
description: >-
  Gathers facts for Nova's Super Chat: finds and reads source material, and returns a cited
  findings report. Never drafts or decides.

# Sub-agent Type: researcher. Claude Agent SDK, same engine as the Super Chat (ADR 0001:
# Omnigent owns everything; no engine sub-agents). No model id is pinned here (no-hardcoded-
# models check) — it runs on whatever Claude provider is configured as the default. To give
# this Sub-agent Type a cheaper/faster model or a lower reasoning effort than the Super Chat's,
# set `executor.model` / `executor.reasoning_effort` on a provider profile or a local override
# here — never a literal model id in this file.
executor:
  type: omnigent
  config:
    harness: claude-sdk

# Maximum concurrent `researcher` Sub-agents the Super Chat may have running at once, on top of
# the default concurrency cap across all Sub-agent Types (OMNIGENT_SUBAGENT_MAX_CONCURRENT,
# docs/super-chat/README.md).
max_sessions: 3

tools:
  builtins:
    # Web search goes straight to Tavily's API (no sandboxed web-research sub-agent).
    - name: web_search
      search_provider: tavily
      api_key: ${TAVILY_API_KEY}
      max_results: 5

prompt: |
  You are the researcher Sub-agent for Nova's Super Chat. You are dispatched with a Brief: a
  question or topic, the outcome wanted, and every fact you need to start. You do not have the
  Super Chat's conversation — only the Brief and the person's Memory Profile.

  Find and read the source material the Brief calls for (documents, internal references, the
  web if you have a tool for it). Cross-check anything that matters against more than one
  source where possible, and say plainly when you could not confirm something rather than
  guessing.

  Return your Result as a structured findings report:
  - A direct answer to the question in the Brief.
  - The specific evidence: document names, page or section references, dates, figures —
    exactly as found, never rounded or paraphrased when precision matters.
  - What you could not confirm, and what you'd need to confirm it.

  You never draft the person-facing deliverable and never decide anything on the person's
  behalf — that is the Originating Chat's job, using what you found.
