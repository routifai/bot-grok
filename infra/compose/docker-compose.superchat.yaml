name: superchat

# Superchat on Omnigent's own Compose stack. Layer it on top of Omnigent's file, unchanged; from the
# repo root:
#
#   docker compose --env-file .env \
#     -f engine/omnigent/deploy/docker/docker-compose.yaml \
#     -f infra/compose/docker-compose.superchat.yaml up --build
#
# (./scripts/setup.sh writes .env and runs exactly that.) A machine behind a company firewall adds
# its own third `-f` file for mirrors and its CA bundle; see docs/SETUP.md.
#
# Compose resolves every relative path against the FIRST file's directory,
# engine/omnigent/deploy/docker, so the repo root is ../../../.. here.
#
# Omnigent's file brings `postgres` and `omnigent`. This file turns `omnigent` into Superchat's
# engine (Omnigent's server image + infra/omnigent) and adds the Computers (Omnigent's host image +
# a thin layer, started one per person by the supervisor) and the app (api, worker, web: one image).

# Optional build inputs, all unset by default (see .env.docker.example).
x-build-args: &build-args
  - NODE_IMAGE
  - PYPI_INDEX_URL
  - NPM_CONFIG_REGISTRY

# api, worker and web share this one image and differ only in their command.
x-app-build: &app-build
  context: ../../../..
  dockerfile: infra/compose/Dockerfile
  args: *build-args

x-proxy-env: &proxy-env
  HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
  HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
  NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
  http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
  https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
  no_proxy: ${no_proxy:-${NO_PROXY:-}}

services:
  # Omnigent's Postgres, as is: one database, two schemas, `app` (API, Prisma) and `engine`
  # (Omnigent), created on first init.
  postgres:
    volumes:
      - ../../../../infra/compose/postgres/schemas.sql:/docker-entrypoint-initdb.d/schemas.sql:ro

  # Build-only: Omnigent's server image, from Omnigent's Dockerfile (or a variant of it: a
  # machine's own -f file may swap the dockerfile, args and secrets here). The engine is built FROM it.
  omnigent-server:
    image: superchat/omnigent-server:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        - NODE_IMAGE
        - PYTHON_IMAGE
        - PYPI_INDEX_URL
        - NPM_CONFIG_REGISTRY
        - OMNIGENT_EXTRAS=memory,postgres
    command: ["true"]
    restart: "no"

  # Build-only: Omnigent's host image (its Dockerfile's `host` target), the Computer's base. On
  # Playwright's Ubuntu image, whose Chromium the Computer uses; only the claude and pi CLIs.
  omnigent-host:
    image: superchat/omnigent-host:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: host
      args:
        - NODE_IMAGE
        - PYTHON_IMAGE=${COMPUTER_BASE_IMAGE:-mcr.microsoft.com/playwright/python:v1.63.0-noble@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0}
        - PYPI_INDEX_URL
        - NPM_CONFIG_REGISTRY
        - MINIMAL_HOST=1
    command: ["true"]
    restart: "no"

  # Build-only: the Computer image the supervisor starts for each person.
  computer:
    image: superchat/computer:local
    build:
      context: ../../../..
      dockerfile: infra/sandboxes/computer/Dockerfile
      additional_contexts:
        omnigent-host: service:omnigent-host
      args: *build-args
    command: ["true"]
    restart: "no"

  # Superchat's engine: the server image above with infra/omnigent at /opt/bundle, started by
  # /opt/bundle/engine/start.sh. Each Computer's runner dials it back at ENGINE_PUBLIC_URL, so it is
  # also published on the host.
  omnigent:
    image: superchat/engine:local
    build: !override
      context: ../../../../infra/omnigent
      dockerfile: Dockerfile
      additional_contexts:
        omnigent-server: service:omnigent-server
    environment:
      <<: *proxy-env
      DATABASE_URL: postgres://${POSTGRES_USER:-omnigent}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-omnigent}?options=-csearch_path%3Dengine
      ENGINE_PUBLIC_URL: ${ENGINE_PUBLIC_URL:-http://host.docker.internal:${SUPERCHAT_ENGINE_PORT:-8012}}
      # The API signs every call with this; the engine trusts the identity headers only with it.
      OMNIGENT_AUTH_PROVIDER: header
      OMNIGENT_AUTH_HEADER_SECRET: ${OMNIGENT_PROXY_SECRET:?Set OMNIGENT_PROXY_SECRET in .env}
      OMNIGENT_VAULT_KEY: ${OMNIGENT_VAULT_KEY:?Set OMNIGENT_VAULT_KEY in .env}
      OMNIGENT_SUPERCHAT_SANDBOX_PROVIDER: computer
      OMNIGENT_COMPUTER_SUPERVISOR_URL: http://supervisor:7091
      OMNIGENT_COMPUTER_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:?Set SANDBOX_SUPERVISOR_TOKEN in .env}
      # Must equal the supervisor's DATA_DIR: Computer homes are <root>/homes/<id> there.
      OMNIGENT_COMPUTER_HOME_ROOT: /data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Set both to send every model call through a LiteLLM proxy (start.sh picks its config).
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
    extra_hosts:
      # Docker Desktop and colima resolve this already; native Linux needs it.
      - "host.docker.internal:host-gateway"
    ports: !override
      - "${SUPERCHAT_ENGINE_BIND:-127.0.0.1}:${SUPERCHAT_ENGINE_PORT:-8012}:8000"
    depends_on:
      supervisor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  supervisor:
    build:
      context: ../../../..
      dockerfile: infra/sandboxes/supervisor/Dockerfile
      args: *build-args
    # /data is shared with the app, which runs as uid 1000.
    command: ["sh", "-c", "chown -R 1000:1000 /data && exec pnpm exec tsx src/index.ts"]
    environment:
      DATA_DIR: /data
      SUPERVISOR_HOST: "0.0.0.0"
      SUPERVISOR_PORT: "7091"
      DOCKER_SOCKET: /var/run/docker.sock
      SUPERCHAT_COMPUTER_IMAGE: superchat/computer:local
      SUPERCHAT_COMPUTER_MEMORY: ${SUPERCHAT_COMPUTER_MEMORY:-2g}
      SUPERCHAT_COMPUTER_CPUS: ${SUPERCHAT_COMPUTER_CPUS:-2}
      SUPERCHAT_COMPUTER_PIDS_LIMIT: ${SUPERCHAT_COMPUTER_PIDS_LIMIT:-2048}
      SANDBOX_COMMAND_TIMEOUT_MS: ${SANDBOX_COMMAND_TIMEOUT_MS:-300000}
      SANDBOX_TEAM_SCREEN_LIMIT: ${SANDBOX_TEAM_SCREEN_LIMIT:-0}
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:?Set SANDBOX_SUPERVISOR_TOKEN in .env}
      SANDBOX_SCREEN_NETWORK: isolated
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-}
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-}
      AXIOM_EDGE: ${AXIOM_EDGE:-}
      AXIOM_EDGE_URL: ${AXIOM_EDGE_URL:-}
    volumes:
      # The Docker socket, resolved inside the Docker VM: /var/run/docker.sock for Docker Desktop and colima alike.
      # DOCKER_SOCKET_PATH in .env overrides it only for unusual setups (e.g. rootless Docker).
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      # Omnigent's data volume, shared with the engine: it creates each Computer's home there and
      # the supervisor mounts that home into the Computer (a Mac folder can't be chowned to uid 1000).
      - artifact-data:/data
    depends_on:
      computer:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:7091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    image: superchat/app:local
    build: *app-build
    command: ["bash", "-lc", "pnpm --filter @superchat/db exec prisma migrate deploy && pnpm --filter @superchat/api start"]
    env_file:
      - ../../../../.env
    environment:
      <<: *proxy-env
      DATABASE_URL: postgres://${POSTGRES_USER:-omnigent}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-omnigent}?schema=app
      API_HOST: "0.0.0.0"
      DATA_DIR: /data
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      SANDBOX_PROVIDER: docker
      # The Omnigent chat engine (the omnigent service unless OMNIGENT_URL points elsewhere).
      OMNIGENT_URL: ${OMNIGENT_URL:-http://omnigent:8000}
      OMNIGENT_PROXY_SECRET: ${OMNIGENT_PROXY_SECRET:?Set OMNIGENT_PROXY_SECRET in .env}
    ports:
      - "127.0.0.1:${SUPERCHAT_API_PORT:-3100}:3100"
    volumes:
      # Omnigent's data volume, shared with the engine: it creates each Computer's home there and
      # the supervisor mounts that home into the Computer (a Mac folder can't be chowned to uid 1000).
      - artifact-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      supervisor:
        condition: service_healthy
      omnigent:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  worker:
    image: superchat/app:local
    build: *app-build
    command: ["pnpm", "--filter", "@superchat/worker", "start"]
    env_file:
      - ../../../../.env
    environment:
      <<: *proxy-env
      BETTER_AUTH_SECRET: ""
      DATABASE_URL: postgres://${POSTGRES_USER:-omnigent}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-omnigent}?schema=app
      DATA_DIR: /data
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      SANDBOX_PROVIDER: docker
      OMNIGENT_URL: ${OMNIGENT_URL:-http://omnigent:8000}
      OMNIGENT_PROXY_SECRET: ${OMNIGENT_PROXY_SECRET:?Set OMNIGENT_PROXY_SECRET in .env}
      SCREEN_PROXY_SECRET: ""
    volumes:
      # Omnigent's data volume, shared with the engine: it creates each Computer's home there and
      # the supervisor mounts that home into the Computer (a Mac folder can't be chowned to uid 1000).
      - artifact-data:/data
    depends_on:
      api:
        condition: service_healthy

  web:
    image: superchat/app:local
    build: *app-build
    command: ["pnpm", "--filter", "@superchat/web", "preview", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      API_PROXY_TARGET: http://api:3100
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET:?Set SCREEN_PROXY_SECRET in .env}
      SUPERCHAT_HOST: ${SUPERCHAT_HOST:-localhost}
    ports:
      - "127.0.0.1:${SUPERCHAT_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
