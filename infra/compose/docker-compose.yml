name: superchat

# Image bases and package sources for every image built here. Unset, each Dockerfile's public
# default holds (Ubuntu 24.04, the official Node image, public apt/npm/PyPI); a company sets its
# own registry and mirrors in .env (see .env.docker.example).
x-image-build-args: &image-build-args
  - BASE_IMAGE
  - NODE_IMAGE
  - APT_MIRROR
  - NPM_CONFIG_REGISTRY
  - PYPI_INDEX_URL
  - PLAYWRIGHT_DOWNLOAD_HOST

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      # USER/PASSWORD/DB apply only on first pgdata init. Keep existing values in
      # .env, or ALTER ROLE / rename in place. Recreate pgdata only after backup
      # (or when the volume is disposable); down -v deletes all DB state.
      POSTGRES_USER: ${POSTGRES_USER:-superchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-superchat_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superchat} -d ${POSTGRES_DB:-superchat_db}"]
      interval: 3s
      timeout: 5s
      retries: 20

  # One database, two schemas: `app` (API, Prisma) and `engine` (Omnigent). Runs on every `up`.
  db-init:
    image: ${POSTGRES_IMAGE:-postgres:16}
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/init/schemas.sql"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-superchat}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-superchat_db}
    volumes:
      - ./postgres/schemas.sql:/init/schemas.sql:ro
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  supervisor:
    build:
      context: ../..
      dockerfile: infra/sandboxes/supervisor/Dockerfile
      args: *image-build-args
    environment:
      DATA_DIR: /data
      SUPERVISOR_HOST: "0.0.0.0"
      SUPERVISOR_PORT: "7091"
      DOCKER_SOCKET: /var/run/docker.sock
      SUPERCHAT_COMPUTER_IMAGE: superchat/computer:local
      SUPERCHAT_COMPUTER_MEMORY: ${SUPERCHAT_COMPUTER_MEMORY:-2g}
      SUPERCHAT_COMPUTER_CPUS: ${SUPERCHAT_COMPUTER_CPUS:-2}
      SUPERCHAT_COMPUTER_PIDS_LIMIT: ${SUPERCHAT_COMPUTER_PIDS_LIMIT:-2048}
      SANDBOX_COMMAND_TIMEOUT_MS: ${SANDBOX_COMMAND_TIMEOUT_MS:-300000}
      SANDBOX_TEAM_SCREEN_LIMIT: ${SANDBOX_TEAM_SCREEN_LIMIT:-0}
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:?Set SANDBOX_SUPERVISOR_TOKEN in .env}
      SANDBOX_SCREEN_NETWORK: isolated
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-}
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-}
      AXIOM_EDGE: ${AXIOM_EDGE:-}
      AXIOM_EDGE_URL: ${AXIOM_EDGE_URL:-}
    volumes:
      # The Docker socket, resolved inside the Docker VM: /var/run/docker.sock for Docker Desktop and colima alike.
      # DOCKER_SOCKET_PATH in .env overrides it only for unusual setups (e.g. rootless Docker).
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ../../data:/data
    depends_on:
      computer:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:7091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  computer:
    image: superchat/computer:local
    build:
      # Root context (not sandboxes/computer) so the image can vendor engine/omnigent — see
      # infra/sandboxes/computer/Dockerfile's omnigent-builder stage.
      context: ../..
      dockerfile: infra/sandboxes/computer/Dockerfile
      args: *image-build-args
    command: ["true"]
    restart: "no"

  data-init:
    image: ${BUSYBOX_IMAGE:-busybox:1}
    command: ["chown", "-R", "1000:1000", "/data"]
    restart: "no"
    volumes:
      - ../../data:/data

  # The Omnigent engine: runs every chat turn. Same image as the hosted engine. Each Computer's
  # runner dials it back at ENGINE_PUBLIC_URL, so it is also published on the host.
  engine:
    image: superchat/engine:local
    build:
      context: ../..
      dockerfile: infra/railway/Dockerfile.engine
      args: *image-build-args
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-superchat}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-superchat_db}?options=-csearch_path%3Dengine
      ENGINE_PUBLIC_URL: ${ENGINE_PUBLIC_URL:-http://host.docker.internal:${SUPERCHAT_ENGINE_PORT:-8012}}
      # The API signs every call with this; the engine trusts the identity headers only with it.
      OMNIGENT_AUTH_HEADER_SECRET: ${OMNIGENT_PROXY_SECRET:?Set OMNIGENT_PROXY_SECRET in .env}
      OMNIGENT_VAULT_KEY: ${OMNIGENT_VAULT_KEY:?Set OMNIGENT_VAULT_KEY in .env}
      OMNIGENT_COMPUTER_SUPERVISOR_URL: http://supervisor:7091
      OMNIGENT_COMPUTER_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:?Set SANDBOX_SUPERVISOR_TOKEN in .env}
      # Must equal the supervisor's DATA_DIR: Computer homes are <root>/homes/<id> there.
      OMNIGENT_COMPUTER_HOME_ROOT: /data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Passed through only when set (in .env or the shell); otherwise the image's defaults hold.
      SUPERCHAT_CLAUDE_MODEL:
      OMNIGENT_HELPER_MODEL_FAST:
      OMNIGENT_HELPER_MODEL_STRONG:
      HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
      HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
      NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
    extra_hosts:
      # Docker Desktop and colima resolve this already; native Linux needs it.
      - "host.docker.internal:host-gateway"
    ports:
      - "${SUPERCHAT_ENGINE_BIND:-127.0.0.1}:${SUPERCHAT_ENGINE_PORT:-8012}:8000"
    volumes:
      - enginedata:/data
    depends_on:
      db-init:
        condition: service_completed_successfully
      supervisor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # api, worker, and web build the exact same image (one Dockerfile, one context) and only differ
  # in their command. Sharing one image tag across all three means Compose builds it once instead
  # of three near-identical multi-hundred-MB images.
  api:
    image: superchat/app:local
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args: *image-build-args
    command: ["bash", "-lc", "pnpm --filter @superchat/db exec prisma migrate deploy && pnpm --filter @superchat/api start"]
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-superchat}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-superchat_db}?schema=app
      API_HOST: "0.0.0.0"
      DATA_DIR: /data
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      SANDBOX_PROVIDER: docker
      # The Omnigent chat engine (the engine service unless OMNIGENT_URL points elsewhere).
      OMNIGENT_URL: ${OMNIGENT_URL:-http://engine:8000}
      OMNIGENT_PROXY_SECRET: ${OMNIGENT_PROXY_SECRET:?Set OMNIGENT_PROXY_SECRET in .env}
      # Optional egress proxy (Mainland / corporate). Empty = unset; either case works.
      HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
      HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
      NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
      http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
      https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
      no_proxy: ${no_proxy:-${NO_PROXY:-}}
    ports:
      - "127.0.0.1:${SUPERCHAT_API_PORT:-3100}:3100"
    volumes:
      - ../../data:/data
    depends_on:
      db-init:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully
      supervisor:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  worker:
    image: superchat/app:local
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args: *image-build-args
    command: ["pnpm", "--filter", "@superchat/worker", "start"]
    env_file:
      - ../../.env
    environment:
      BETTER_AUTH_SECRET: ""
      DATABASE_URL: postgres://${POSTGRES_USER:-superchat}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-superchat_db}?schema=app
      DATA_DIR: /data
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      SANDBOX_PROVIDER: docker
      # The Omnigent chat engine (the engine service unless OMNIGENT_URL points elsewhere).
      OMNIGENT_URL: ${OMNIGENT_URL:-http://engine:8000}
      OMNIGENT_PROXY_SECRET: ${OMNIGENT_PROXY_SECRET:?Set OMNIGENT_PROXY_SECRET in .env}
      SCREEN_PROXY_SECRET: ""
      # Optional egress proxy (Mainland / corporate). Empty = unset; either case works.
      HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
      HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
      NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
      http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
      https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
      no_proxy: ${no_proxy:-${NO_PROXY:-}}
    volumes:
      - ../../data:/data
    depends_on:
      db-init:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully
      supervisor:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    image: superchat/app:local
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args: *image-build-args
    command: ["pnpm", "--filter", "@superchat/web", "preview", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      API_PROXY_TARGET: http://api:3100
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET:?Set SCREEN_PROXY_SECRET in .env}
      SUPERCHAT_HOST: ${SUPERCHAT_HOST:-localhost}
    ports:
      - "127.0.0.1:${SUPERCHAT_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  enginedata:
